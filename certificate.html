<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate — Voyager Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111114">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    .va-cert-wrap { max-width: 900px; margin: var(--sp-5) auto; padding: 0 var(--sp-4); text-align: center; }
    #cert-canvas { width: 100%; height: auto; border: 1px solid var(--va-border); border-radius: var(--radius-md); }
  </style>
</head>
<body>
  <nav class="va-nav">
    <div class="va-nav__logo">Voyager <span>Academy</span></div>
    <ul class="va-nav__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="certificates.html">Certificates</a></li>
      <li id="nav-auth-slot"><a href="auth.html">Log In</a></li>
    </ul>
  </nav>

  <div class="va-cert-wrap">
    <canvas id="cert-canvas" width="1400" height="990"></canvas>
    <p id="cert-status" style="margin-top:var(--sp-3);color:var(--va-text-muted);">Loading…</p>
    <button class="va-btn" id="download-btn" style="display:none;margin-top:var(--sp-2);">Download Certificate</button>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    const TRACK_LABELS = {
      beginner: "Beginner Track", intermediate: "Intermediate Track",
      advanced: "Advanced Track", tradingview: "TradingView Mastery",
      master: "Full Curriculum",
    };

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fitFontSize(ctx, text, maxWidth, startSize, minSize, weight, family) {
      let size = startSize;
      while (size > minSize) {
        ctx.font = `${weight} ${size}px ${family}`;
        if (ctx.measureText(text).width <= maxWidth) break;
        size -= 2;
      }
      return size;
    }

    function drawCertificate(studentName, trackLabel, dateStr, certId) {
    const canvas = document.getElementById("cert-canvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    const cx = W / 2;

    // Dark base
    ctx.fillStyle = "#0d0d10";
    ctx.fillRect(0, 0, W, H);

    // Faint dot-grid texture
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#1c1c20";
    for (let gx = 40; gx < W; gx += 40) {
      for (let gy = 40; gy < H; gy += 40) {
        ctx.beginPath();
        ctx.arc(gx, gy, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // Center glow
    const glow = ctx.createRadialGradient(cx, H * 0.42, 50, cx, H * 0.42, 520);
    glow.addColorStop(0, "rgba(200,16,46,0.22)");
    glow.addColorStop(1, "rgba(200,16,46,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Sliced corner accents
    ctx.beginPath();
    ctx.moveTo(W, 0);
    ctx.lineTo(W, 230);
    ctx.lineTo(W - 230, 0);
    ctx.closePath();
    ctx.fillStyle = "#c8102e";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, H - 180);
    ctx.lineTo(180, H);
    ctx.closePath();
    ctx.fillStyle = "rgba(200,16,46,0.5)";
    ctx.fill();

    ctx.textAlign = "center";

    // Logo lockup — swap this block for drawImage(logoImg, ...) if you have a real logo file
    const badgeY = 110;
    const bgrad = ctx.createLinearGradient(cx - 34, badgeY - 34, cx + 34, badgeY + 34);
    bgrad.addColorStop(0, "#ff2d4d");
    bgrad.addColorStop(1, "#c8102e");
    roundRect(ctx, cx - 34, badgeY - 34, 68, 68, 16);
    ctx.fillStyle = bgrad;
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "700 34px 'Space Grotesk', sans-serif";
    ctx.fillText("V", cx, badgeY + 12);

    ctx.font = "700 24px 'Space Grotesk', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("VOYAGER ACADEMY", cx, badgeY + 70);

    // Eyebrow
    ctx.font = "700 18px 'Inter', sans-serif";
    ctx.fillStyle = "#ff5a72";
    ctx.fillText("C E R T I F I C A T E   O F   A C H I E V E M E N T", cx, 280);

    // Student name — huge, centered, auto-fit
    const maxNameWidth = W - 200;
    const nameSize = fitFontSize(ctx, studentName, maxNameWidth, 96, 42, "700", "'Space Grotesk', sans-serif");
    ctx.font = `700 ${nameSize}px 'Space Grotesk', sans-serif`;
    ctx.fillStyle = "#ffffff";
    ctx.fillText(studentName, cx, 400);

    ctx.strokeStyle = "#c8102e";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 60, 440);
    ctx.lineTo(cx + 60, 440);
    ctx.stroke();

    ctx.font = "26px 'Inter', sans-serif";
    ctx.fillStyle = "#b8b8bd";
    ctx.fillText("has successfully completed the", cx, 500);

    const trackSize = fitFontSize(ctx, trackLabel, maxNameWidth, 52, 30, "700", "'Space Grotesk', sans-serif");
    ctx.font = `700 ${trackSize}px 'Space Grotesk', sans-serif`;
    ctx.fillStyle = "#c8102e";
    ctx.fillText(trackLabel, cx, 570);

    ctx.font = "20px 'Inter', sans-serif";
    ctx.fillStyle = "#8a8a90";
    ctx.fillText("at Voyager Academy  ·  " + dateStr, cx, 620);

    // Verified seal
    const sx = cx, sy = 760;
    const sgrad = ctx.createRadialGradient(sx, sy, 10, sx, sy, 80);
    sgrad.addColorStop(0, "#ff2d4d");
    sgrad.addColorStop(1, "#7a0a1e");
    ctx.beginPath();
    ctx.arc(sx, sy, 70, 0, Math.PI * 2);
    ctx.fillStyle = sgrad;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, sy, 58, 0, Math.PI * 2);
    ctx.fillStyle = "#0d0d10";
    ctx.fill();
    ctx.font = "700 20px 'Inter', sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText("VERIFIED", sx, sy - 6);
    ctx.font = "700 36px 'Space Grotesk', sans-serif";
    ctx.fillText("V", sx, sy + 32);

    // Cert ID chip
    ctx.font = "15px 'JetBrains Mono', monospace";
    const chipText = "CERT ID  " + certId;
    const chipW = ctx.measureText(chipText).width + 40;
    const chipX = cx - chipW / 2, chipY = H - 70, chipH = 42;
    roundRect(ctx, chipX, chipY, chipW, chipH, 21);
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = "#d8d8dc";
    ctx.textBaseline = "middle";
    ctx.fillText(chipText, cx, chipY + chipH / 2 + 1);
    ctx.textBaseline = "alphabetic";
  }

    async function init() {
      const status = document.getElementById("cert-status");
      const track = new URLSearchParams(window.location.search).get("track");
      const student = vaGetStudent();

      if (!student) {
        status.textContent = "Please log in to view your certificate.";
        return;
      }
      const certs = await vaGetCertificates();
      const cert = certs.find((c) => c.track === track);

      if (!cert || !cert.earned) {
        status.textContent = "This certificate hasn't been earned yet — keep going!";
        return;
      }

      const dateStr = new Date(cert.completed_at).toLocaleDateString(undefined, {
        year: "numeric", month: "long", day: "numeric",
      });
      const certId = `VA-${student.id}-${track.toUpperCase()}`.slice(0, 24);

      await document.fonts.ready;
      drawCertificate(student.name, TRACK_LABELS[track], dateStr, certId);

      status.textContent = "Congratulations!";
      const btn = document.getElementById("download-btn");
      btn.style.display = "inline-flex";
      btn.addEventListener("click", () => {
        const link = document.createElement("a");
        link.download = `voyager-academy-${track}-certificate.png`;
        link.href = document.getElementById("cert-canvas").toDataURL("image/png");
        link.click();
      });
    }
    init();
  </script>
</body>
</html>
