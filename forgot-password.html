<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const saved = localStorage.getItem("va_theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — Voyager Academy</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
</head>
<body data-focus>
  <div class="au">
    <aside class="au__brand" id="au-brand"></aside>
    <main class="au__main">
      <div class="au__top" id="au-top"></div>
      <div class="au__card">
        <h1>Reset your password</h1>
        <p class="au__sub" id="fp-sub">Enter the email you signed up with and we'll send you a link to choose a new password.</p>
        <div class="au__alert" id="au-alert" role="alert" hidden></div>

        <form id="fp-form" novalidate>
          <div class="au__field">
            <label for="f-email">Email</label>
            <input class="va-input" id="f-email" type="email" autocomplete="email" inputmode="email" aria-describedby="e-email">
            <div class="au__hint" id="e-email"></div>
          </div>
          <button class="va-btn au__btn" id="fp-submit" type="submit">Send reset link</button>
          <div class="au__status" id="au-status" aria-live="polite"></div>
        </form>

        <div class="au__done" id="fp-done" hidden>
          <h2>Check your inbox</h2>
          <p class="au__sub">If <strong id="fp-email"></strong> belongs to an account, a reset link is on its way. It works for one hour. Not there? Check your spam folder.</p>
          <button class="va-btn au__btn au__ghost" id="fp-resend" type="button" disabled>Send again</button>
        </div>

        <p class="au__alt"><a href="auth.html">← Back to log in</a></p>
      </div>
    </main>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    (function () {
      const { $, busy, showAlert, slowHint, apiPost, setHint } = AU;
      AU.fillShell();
      const prefill = new URLSearchParams(location.search).get("email");
      if (prefill) $("f-email").value = prefill;
      let timer = null;

      function cooldown(btn, secs) {
        clearInterval(timer);
        let left = secs;
        btn.disabled = true;
        const tick = () => {
          btn.textContent = left > 0 ? `Send again in ${left}s` : "Send again";
          if (left <= 0) { btn.disabled = false; clearInterval(timer); }
          left--;
        };
        tick();
        timer = setInterval(tick, 1000);
      }

      async function send(email) {
        const done = slowHint($("au-status"));
        try { await apiPost("/auth/forgot-password", { email }); }
        finally { done(); }
      }

      $("f-email").addEventListener("input", () => setHint("f-email", "e-email", ""));

      $("fp-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = $("f-email").value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setHint("f-email", "e-email", "Enter a valid email address."); $("f-email").focus(); return; }
        showAlert($("au-alert"), "");
        busy($("fp-submit"), true, "Sending…");
        try {
          await send(email);
          $("fp-form").hidden = true;
          $("fp-sub").hidden = true;
          $("fp-done").hidden = false;
          $("fp-email").textContent = email;
          cooldown($("fp-resend"), 60);
        } catch (err) {
          showAlert($("au-alert"), err.message);
          busy($("fp-submit"), false);
        }
      });

      $("fp-resend").addEventListener("click", async () => {
        try {
          await send($("f-email").value.trim());
          showAlert($("au-alert"), "Sent again — check your inbox.", true);
          cooldown($("fp-resend"), 60);
        } catch (err) { showAlert($("au-alert"), err.message); }
      });
    })();
  </script>
</body>
</html>
