<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Voyager Academy</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body style="display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:system-ui,sans-serif;">
  <div>
    <div style="font-size:3rem;">📡</div>
    <h1 style="font-family:var(--font-heading, system-ui);margin:8px 0;">You're offline</h1>
    <p style="color:#6b6b72;max-width:34ch;margin:0 auto 20px;">This page isn't saved on your device yet. Reconnect and try again — pages you've already visited still work offline.</p>
    <button class="va-btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
