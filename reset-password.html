<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Voyager Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .va-auth-wrap { max-width: 400px; margin: var(--sp-6) auto; padding: 0 var(--sp-5); }
    .va-auth-card { border: 2px solid var(--va-border); border-radius: var(--radius-lg); padding: var(--sp-5); }
    .va-input { width: 100%; padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3); border: 2px solid var(--va-border); border-radius: var(--radius-sm); font-family: var(--font-base); font-size: 1rem; }
  </style>
</head>
<body>
  <nav class="va-nav">
    <div class="va-nav__logo">Voyager <span>Academy</span></div>
    <ul class="va-nav__links"><li><a href="auth.html">&larr; Back to Log In</a></li></ul>
  </nav>

  <div class="va-auth-wrap">
    <div class="va-auth-card">
      <h3 style="font-family:var(--font-heading);margin-bottom:var(--sp-3);">Choose a New Password</h3>
      <form id="rp-form">
        <input class="va-input" type="password" id="rp-password" placeholder="New password (min. 8 characters)" minlength="8" required>
        <input class="va-input" type="password" id="rp-confirm" placeholder="Confirm new password" minlength="8" required>
        <button type="submit" class="va-btn" style="width:100%;">Reset Password</button>
      </form>
    </div>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      document.getElementById("rp-form").innerHTML = "<p>This reset link is missing its token. Please request a new one from the Forgot Password page.</p>";
    }

    document.getElementById("rp-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = document.getElementById("rp-password").value;
      const confirm = document.getElementById("rp-confirm").value;
      if (pw !== confirm) return vaToast("Passwords don't match.", "error");
      try {
        await vaResetPassword(token, pw);
        vaToast("Password updated! Redirecting to log in…", "success");
        setTimeout(() => (window.location.href = "auth.html"), 1500);
      } catch (err) {
        vaToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
