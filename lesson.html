<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const saved = localStorage.getItem("va_theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson — Voyager Academy</title>
  <meta property="og:title" content="Voyager Academy — Free Trading Lesson">
  <meta property="og:description" content="Part of Voyager Academy's free trading curriculum — lessons, quizzes and certificates.">
  <meta property="og:image" content="https://visualvoyagestudios.github.io/voyager-Academy/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111114">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
  <nav class="va-nav">
    <div class="va-nav__logo">Voyager <span>Academy</span></div>
    <ul class="va-nav__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html" class="active">Courses</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="certificates.html">Certificates</a></li>
      <li id="nav-auth-slot"><a href="auth.html">Log In</a></li>
    </ul>
  </nav>

  <div class="va-lesson">
    <a href="courses.html" class="va-lesson__back">&larr; Back to Courses</a>
    <div class="va-lesson__tag" id="lesson-tag"></div>
    <div id="lesson-position" style="font-size:0.85rem;color:var(--color-text-muted, var(--va-text-muted));margin-bottom:var(--sp-2);"></div>
    <h1 id="lesson-title">Loading…</h1>
    <div class="va-lesson__body" id="lesson-body"></div>

    <div id="lesson-cta" style="margin-top:var(--sp-5);"></div>

    <div class="va-lesson-pager" id="lesson-pager"></div>

  </div>

  <script src="js/courses-data.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/diagrams-2.js"></script>
  <script src="js/quizzes.js"></script>
  <script src="js/quizzes-2.js"></script>
  <script src="js/video-content.js"></script>
  <script src="js/lesson-figures.js"></script>
  <script src="js/lesson-charts.js"></script>
  <script src="js/lesson-ux.js"></script>
  <script src="js/lessons-content.js"></script>
  <script src="js/lessons-2.js"></script>
  <script src="js/lesson-extras.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Declared first so nothing below can read it before it exists.
    const TRACK_LABELS = {
      beginner: "Liftoff", intermediate: "Ascent", advanced: "Summit",
      macro: "Mission Control", tradingview: "The Bridge", funded: "Proving Ground",
    };
    const COMPLETED_HTML = `<span class="va-btn" style="background:var(--va-bull);pointer-events:none;">Completed ✓</span>`;

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const meta = COURSE_DATA.find((c) => c.slug === slug);
    const body = LESSON_CONTENT[slug];

    function notifyError(message) {
      if (typeof vaToast === "function") vaToast(message, "error");
      else alert(message);
    }

    function renderPositionBadge() {
      document.getElementById("lesson-tag").textContent = TRACK_LABELS[meta.track] || meta.track;
      const trackLessons = COURSE_DATA.filter((c) => c.track === meta.track);
      const pos = trackLessons.findIndex((c) => c.slug === slug) + 1;
      document.getElementById("lesson-position").textContent = `Lesson ${pos} of ${trackLessons.length}`;
    }

    function renderPager() {
      const idx = COURSE_DATA.findIndex((c) => c.slug === slug);
      const prev = idx > 0 ? COURSE_DATA[idx - 1] : null;
      const next = idx < COURSE_DATA.length - 1 ? COURSE_DATA[idx + 1] : null;
      document.getElementById("lesson-pager").innerHTML = `
        ${prev ? `<a href="lesson.html?slug=${prev.slug}"><div class="va-lesson-pager__label">&larr; Previous</div><div class="va-lesson-pager__title">${prev.title}</div></a>` : "<div></div>"}
        ${next ? `<a href="lesson.html?slug=${next.slug}" class="va-lesson-pager--next"><div class="va-lesson-pager__label">Next &rarr;</div><div class="va-lesson-pager__title">${next.title}</div></a>` : "<div></div>"}
      `;
    }

    function showMarkCompleteButton() {
      const cta = document.getElementById("lesson-cta");
      cta.innerHTML = `<button class="va-btn" id="mark-complete-btn">Mark Lesson Complete</button>`;
      document.getElementById("mark-complete-btn").addEventListener("click", async () => {
        try {
          await vaMarkComplete(slug);
          cta.innerHTML = COMPLETED_HTML;
        } catch (err) {
          notifyError("Couldn't save progress — try again in a moment.");
        }
      });
    }

    async function setupLessonCta() {
      const cta = document.getElementById("lesson-cta");
      const hasQuiz = typeof QUIZ_DATA !== "undefined" && !!QUIZ_DATA[slug];
      const loggedIn = !!vaGetToken();

      // 1) Instant default — never waits on the backend.
      if (hasQuiz) {
        cta.innerHTML = `<a href="quiz.html?slug=${slug}" class="va-btn">Take the Quiz &rarr;</a>` +
          (loggedIn ? "" : `<p style="margin-top:var(--sp-2);font-size:0.85rem;color:var(--color-text-muted, var(--va-text-muted));">You'll be asked to log in so your progress is saved.</p>`);
      } else if (!loggedIn) {
        cta.innerHTML = `<a href="auth.html" class="va-btn">Log In to Track Progress</a>`;
      } else {
        showMarkCompleteButton();
      }
      if (!loggedIn) return;

      // 2) Refine with real progress; if the backend is slow or down, the default above stays.
      try {
        const progress = await vaGetProgress();
        if (progress.some((p) => p.lesson_slug === slug)) cta.innerHTML = COMPLETED_HTML;
      } catch (err) {
        console.warn("Couldn't load progress:", err);
      }
    }

    if (meta && body) {
      document.title = `${meta.title} — Voyager Academy`;
      document.getElementById("lesson-title").textContent = meta.title;
      document.getElementById("lesson-body").innerHTML = body;

      // innerHTML doesn't run <script> tags — recreate them so embedded widgets load
      document.querySelectorAll("#lesson-body script").forEach((oldScript) => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach((attr) => newScript.setAttribute(attr.name, attr.value));
        newScript.textContent = oldScript.textContent;
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      const videoId = typeof VIDEO_CONTENT !== "undefined" && VIDEO_CONTENT[slug];
      if (videoId) {
        document.getElementById("lesson-body").insertAdjacentHTML(
          "afterbegin",
          `<div class="va-video"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`
        );
      }

      try { renderPositionBadge(); } catch (e) { console.error(e); }
      try { renderPager(); } catch (e) { console.error(e); }
      setupLessonCta().catch((e) => console.error(e));
    } else {
      document.getElementById("lesson-tag").textContent = "Coming Soon";
      document.getElementById("lesson-title").textContent = "This lesson isn't written yet";
      document.getElementById("lesson-body").innerHTML = "<p>Check back soon.</p>";
    }
  </script>
  <script src="js/lesson-ux.js"></script>
</body>
</html>
