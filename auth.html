<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Voyager Academy</title>
  <link rel="stylesheet" href="css/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111114">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VA Academy">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    .va-auth-wrap { max-width: 400px; margin: var(--sp-6) auto; padding: 0 var(--sp-5); }
    .va-auth-card { border: 2px solid var(--va-border); border-radius: var(--radius-lg); padding: var(--sp-5); }
    .va-auth-tabs { display: flex; margin-bottom: var(--sp-4); border-bottom: 2px solid var(--va-border); }
    .va-auth-tab { flex: 1; text-align: center; padding: var(--sp-2); font-weight: 700; color: var(--va-text-muted); cursor: pointer; }
    .va-auth-tab.active { color: var(--va-black); border-bottom: 3px solid var(--va-red); margin-bottom: -2px; }
    .va-input { width: 100%; padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-3); border: 2px solid var(--va-border); border-radius: var(--radius-sm); font-family: var(--font-base); font-size: 1rem; }
    .va-input:focus { outline: none; border-color: var(--va-black); }
    .va-auth-error { color: var(--va-red); font-size: 0.85rem; margin-bottom: var(--sp-3); display: none; }
    .va-auth-form { display: none; }
    .va-auth-form.active { display: block; }
  </style>
</head>
<body>
  <nav class="va-nav">
    <div class="va-nav__logo"><a href="index.html">Voyager <span>Academy</span></a></div>
  </nav>

  <div class="va-auth-wrap">
    <div class="va-auth-card">
      <div class="va-auth-tabs">
        <div class="va-auth-tab active" data-form="login">Log In</div>
        <div class="va-auth-tab" data-form="register">Sign Up</div>
      </div>

      <div class="va-auth-error" id="auth-error"></div>

      <form class="va-auth-form active" id="login-form">
        <input class="va-input" type="email" id="login-email" placeholder="Email" required>
       <div class="va-password-wrap">
          <input class="va-input" type="password" id="login-password" placeholder="Password" required>
          <button type="button" class="va-password-toggle" data-target="login-password">Show</button>
        </div>
        <button type="submit" class="va-btn" style="width:100%;">Log In</button>
      </form>

      <form class="va-auth-form" id="register-form">
        <input class="va-input" type="text" id="register-name" placeholder="Full name" required>
        <input class="va-input" type="email" id="register-email" placeholder="Email" required>
        <div class="va-password-wrap">
          <input class="va-input" type="password" id="register-password" placeholder="Password" required>
          <button type="button" class="va-password-toggle" data-target="register-password">Show</button>
        </div>
        <button type="submit" class="va-btn" style="width:100%;">Create Account</button>
      
        <p style="text-align:center;margin-top:var(--sp-3);font-size:0.85rem;"><a href="forgot-password.html">Forgot password?</a></p>
      </form>
    </div>
  </div>

  <footer class="va-footer">
    &copy; 2026 Voyager Academy. Part of the Voyager Analytics family.
  </footer>

  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.querySelectorAll(".va-auth-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".va-auth-tab").forEach((t) => t.classList.remove("active"));
        document.querySelectorAll(".va-auth-form").forEach((f) => f.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(`${tab.dataset.form}-form`).classList.add("active");
        document.getElementById("auth-error").style.display = "none";
      });
    });

    document.querySelectorAll(".va-password-toggle").forEach((btn) => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "Show" : "Hide";
      });
    });

    function showError(msg) {
      const el = document.getElementById("auth-error");
      el.textContent = msg;
      el.style.display = "block";
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await vaLogin(
          document.getElementById("login-email").value,
          document.getElementById("login-password").value
        );
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message || "Login failed. Check your email and password.");
      }
    });

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await vaRegister(
          document.getElementById("register-name").value,
          document.getElementById("register-email").value,
          document.getElementById("register-password").value
        );
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message || "Registration failed. Try a different email.");
      }
    });
  </script>
</body>
</html>
