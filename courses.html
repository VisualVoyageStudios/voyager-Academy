  <script src="js/courses-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const grid = document.getElementById("course-grid");
    const tabs = document.querySelectorAll(".va-track-tab");

    function render(track) {
      grid.innerHTML = "";
      COURSE_DATA
        .filter((c) => track === "all" || c.track === track)
        .forEach((c) => {
          const card = document.createElement("a");
          card.href = `lesson.html?slug=${c.slug}`;
          card.className = "va-card";
          card.style.display = "block";
          card.innerHTML = `
            <div class="va-card__tag">${c.track}</div>
            <h3>${c.title}</h3>
            <p>${c.summary}</p>
          `;
          grid.appendChild(card);
        });
    }

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        render(tab.dataset.track);
      });
    });

    const urlTrack = new URLSearchParams(window.location.search).get("track");
    if (urlTrack && tabs.length) {
      tabs.forEach((t) => t.classList.toggle("active", t.dataset.track === urlTrack));
      render(urlTrack);
    } else {
      render("all");
    }
  </script>
