<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      const saved = localStorage.getItem("va_theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses — Voyager Academy</title>
  <meta property="og:title" content="Courses — Voyager Academy">
  <meta property="og:description" content="Liftoff, Ascent, Summit, Mission Control, The Bridge and Proving Ground — free lessons with quizzes and certificates.">
  <meta property="og:image" content="https://visualvoyagestudios.github.io/voyager-Academy/assets/images/og-image.png">
  <meta property="og:url" content="https://visualvoyagestudios.github.io/voyager-Academy/courses.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111114">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
</head>
<body>
  <nav class="va-nav">
    <div class="va-nav__logo">Voyager <span>Academy</span></div>
    <ul class="va-nav__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html" class="active">Courses</a></li>
      <li><a href="community.html">Community</a></li>
      <li><a href="certificates.html">Certificates</a></li>
      <li id="nav-auth-slot"><a href="auth.html">Log In</a></li>
    </ul>
  </nav>

  <div class="va-pagehead">
    <h1 style="font-family:var(--font-heading);margin:0 0 var(--sp-2);color:var(--color-text,#111114);">Courses</h1>
    <p id="course-summary" style="color:var(--color-text-muted,#6b6b72);margin:0 0 var(--sp-3);font-size:0.9rem;"></p>
    <input class="va-input" id="course-search" type="search" placeholder="Search lessons…" aria-label="Search lessons" style="max-width:420px;margin-bottom:0;">
  </div>

  <div class="va-track-tabs" id="track-tabs" style="flex-wrap:wrap;">
    <button class="va-track-tab" data-track="all">All</button>
    <button class="va-track-tab" data-track="beginner">Liftoff</button>
    <button class="va-track-tab" data-track="intermediate">Ascent</button>
    <button class="va-track-tab" data-track="advanced">Summit</button>
    <button class="va-track-tab" data-track="macro">Mission Control</button>
    <button class="va-track-tab" data-track="tradingview">The Bridge</button>
    <button class="va-track-tab" data-track="funded">Proving Ground</button>
  </div>

  <div class="va-grid" id="course-grid"></div>

  <script src="js/courses-data.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    const TRACK_LABELS = {
      beginner: "Liftoff (Beginner)", intermediate: "Ascent (Intermediate)", advanced: "Summit (Advanced)",
      macro: "Mission Control", tradingview: "The Bridge (TradingView)", funded: "Proving Ground (Funded Prep)",
    };
    const grid = document.getElementById("course-grid");
    const summary = document.getElementById("course-summary");
    const tabsEl = document.getElementById("track-tabs");
    const search = document.getElementById("course-search");

    let track = new URLSearchParams(location.search).get("track") || "all";
    if (track !== "all" && !TRACK_LABELS[track]) track = "all";
    let query = "", done = new Set(), progressLoaded = false;
    const loggedIn = !!vaGetToken();

    function card(c) {
      return `<a href="lesson.html?slug=${c.slug}" class="va-card" style="display:block;">
        ${done.has(c.slug) ? '<span class="va-card__done">✓ Done</span>' : ""}
        <div class="va-card__tag">${TRACK_LABELS[c.track] || c.track}</div>
        <h3>${c.title}</h3>
        <p>${c.summary}</p>
      </a>`;
    }

    function render() {
      const q = query.trim().toLowerCase();
      const scope = COURSE_DATA.filter((c) => track === "all" || c.track === track);
      const hideDone = !!vaGetPrefs().hideDone && progressLoaded;
      const list = scope.filter((c) => (!q || `${c.title} ${c.summary} ${TRACK_LABELS[c.track]}`.toLowerCase().includes(q)) && !(hideDone && done.has(c.slug)));
      grid.innerHTML = list.length
        ? list.map(card).join("")
        : `<p style="grid-column:1/-1;color:var(--color-text-muted,#6b6b72);">${hideDone && !q ? "Everything here is complete. Turn off “Hide completed lessons” in Settings to see it again." : `No lessons match "${vaEscapeHtml(query)}".`}</p>`;
      if (loggedIn && progressLoaded) {
        const n = scope.filter((c) => done.has(c.slug)).length;
        summary.textContent = `${n} of ${scope.length} lessons complete${track === "all" ? "" : " in " + TRACK_LABELS[track]}`;
      }
    }

    function setActiveTab() {
      tabsEl.querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.track === track));
    }

    tabsEl.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      track = b.dataset.track;
      history.replaceState(null, "", track === "all" ? "courses.html" : `courses.html?track=${track}`);
      setActiveTab();
      render();
    });
    search.addEventListener("input", () => { query = search.value; render(); });

    setActiveTab();
    render();
    if (loggedIn) {
      vaGetProgress()
        .then((p) => { done = new Set(p.map((x) => x.lesson_slug)); progressLoaded = true; render(); })
        .catch(() => {});
    }
  </script>
</body>
</html>
